name: Test Action

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm test

  review:
    runs-on: ubuntu-latest
    env:
      HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        if: env.HAS_API_KEY == 'true'
        with:
          provider: anthropic
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          preset: code-review
          tools: local-files
          prompt: |
            Review this pull request. Focus on:
            - Correctness bugs
            - Security issues
            - Code quality concerns

            Be concise. Only comment on things that matter.
